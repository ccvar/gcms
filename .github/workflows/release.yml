name: Release

# 推送形如 v1.2.3 的 tag 时：在同一个发布作业里交叉编译所有平台，
# 然后直接创建 GitHub Release 并上传产物，不经过 artifact 中转。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_REPO: ccvar/gcms-releases
  PREVIEW_RELEASE_REPO: ccvar/gcms-preview-releases

jobs:
  release:
    name: 编译打包并发布到公开 Release 仓库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 选择发布通道
        run: |
          case "${GITHUB_REF_NAME}" in
            *-preview.*)
              publish_repo="${PREVIEW_RELEASE_REPO}"
              publish_channel="preview"
              ;;
            *)
              publish_repo="${RELEASE_REPO}"
              publish_channel="stable"
              ;;
          esac
          {
            echo "PUBLISH_REPO=${publish_repo}"
            echo "PUBLISH_CHANNEL=${publish_channel}"
          } >> "$GITHUB_ENV"

      - name: 检查发布密钥
        env:
          STABLE_RELEASE_TOKEN: ${{ secrets.GCMS_RELEASE_TOKEN }}
          PREVIEW_RELEASE_TOKEN: ${{ secrets.GCMS_PREVIEW_RELEASE_TOKEN }}
          GCMS_RELEASE_PUBLIC_KEY: ${{ secrets.GCMS_RELEASE_PUBLIC_KEY }}
          GCMS_RELEASE_SIGNING_KEY: ${{ secrets.GCMS_RELEASE_SIGNING_KEY }}
          GCMS_PREVIEW_ACTIVATION_CODE_HASH: ${{ secrets.GCMS_PREVIEW_ACTIVATION_CODE_HASH }}
        run: |
          publish_token="$STABLE_RELEASE_TOKEN"
          if [ "$PUBLISH_CHANNEL" = "preview" ]; then
            publish_token="$PREVIEW_RELEASE_TOKEN"
          fi
          if [ -z "$publish_token" ]; then
            echo "::error::缺少 ${PUBLISH_CHANNEL} 发布 Token；Stable 配置 GCMS_RELEASE_TOKEN，Preview 配置 GCMS_PREVIEW_RELEASE_TOKEN，并授予 ${PUBLISH_REPO} Contents: Read and write。"
            exit 1
          fi
          if [ -z "${GCMS_RELEASE_PUBLIC_KEY:-}" ]; then
            echo "::error::标准发布包要求内置更新验签公钥，请配置 GCMS_RELEASE_PUBLIC_KEY。"
            exit 1
          fi
          if [ -z "$GCMS_RELEASE_SIGNING_KEY" ]; then
            echo "::error::请配置 GCMS_RELEASE_SIGNING_KEY，manifest.json 必须生成签名。"
            exit 1
          fi
          if ! printf '%s' "$GCMS_PREVIEW_ACTIVATION_CODE_HASH" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::请配置 64 位 SHA-256 十六进制 GCMS_PREVIEW_ACTIVATION_CODE_HASH。"
            exit 1
          fi

      - name: 交叉编译全部平台并打包
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          PREVIEW_RELEASE_REPO: ${{ env.PREVIEW_RELEASE_REPO }}
          PREVIEW_ACTIVATION_CODE_HASH: ${{ secrets.GCMS_PREVIEW_ACTIVATION_CODE_HASH }}
          GCMS_RELEASE_PUBLIC_KEY: ${{ secrets.GCMS_RELEASE_PUBLIC_KEY }}
        run: |
          set -e
          rm -rf dist
          printf '%s\n' "$GCMS_RELEASE_PUBLIC_KEY" > scripts/update-public.pem

          for target in \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64" \
            "windows amd64"
          do
            set -- $target
            goos="$1"
            goarch="$2"
            echo "::group::打包 ${goos}/${goarch}"
            sh scripts/package.sh "$goos" "$goarch"
            if [ "$goos" = "windows" ]; then
              name="cms-${VERSION}-${goos}-${goarch}"
              (cd dist && zip -qr "$name.zip" "$name" && rm -f "$name.tar.gz")
            fi
            echo "::endgroup::"
          done

      - name: 列出待发布文件
        run: ls -lh dist/*.tar.gz dist/*.zip

      - name: 生成 SHA256、更新清单与发布说明
        env:
          VERSION: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          PUBLISH_REPO: ${{ env.PUBLISH_REPO }}
        run: |
          python3 scripts/generate-release-manifest.py
          cat dist/checksums.txt
          cat dist/manifest.json

      - name: 生成 manifest 签名
        env:
          GCMS_RELEASE_SIGNING_KEY: ${{ secrets.GCMS_RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          if [ -z "${GCMS_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::缺少 GCMS_RELEASE_SIGNING_KEY，无法生成 manifest 签名。"
            exit 1
          fi
          key_file="$(mktemp)"
          printf '%s\n' "$GCMS_RELEASE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out manifest.json.sig manifest.json
          rm -f "$key_file"
          ls -lh manifest.json.sig

      - name: 发布 Stable Release
        if: env.PUBLISH_CHANNEL == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.GCMS_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/manifest.json
            dist/manifest.json.sig

      - name: 发布 Preview Release
        if: env.PUBLISH_CHANNEL == 'preview'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PREVIEW_RELEASE_REPO }}
          token: ${{ secrets.GCMS_PREVIEW_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/manifest.json
            dist/manifest.json.sig
