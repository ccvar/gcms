name: Pilot Release

# 推形如 pilot-v0.1.8 的 tag 时：在 macOS + Windows runner 上各自打包 GCMS Pilot，
# ed25519 签更新包。各平台直接上传到目标 Release，避免依赖 GitHub Actions
# 临时产物存储额度；最后由 publish 作业合成同时含两平台的 latest.json。
on:
  push:
    tags:
      - "pilot-v*"

permissions:
  contents: read

env:
  RELEASE_REPO: ccvar/gcms-pilot-releases

jobs:
  build:
    name: 构建 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            platform: darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: 检查发布密钥
        shell: bash
        run: |
          if [ -z "${{ secrets.PILOT_RELEASES_TOKEN }}" ]; then
            echo "::error::缺少 PILOT_RELEASES_TOKEN（需对 ${RELEASE_REPO} 授予 Contents 读写）。"; exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY（更新包 ed25519 签名私钥）。"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 + ed25519 更新签名
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 收集产物 + 平台片段
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          ver="${VERSION#pilot-v}"
          bundle="src-tauri/target/${TARGET}/release/bundle"
          out="$GITHUB_WORKSPACE/dist"
          rm -rf "$out"; mkdir -p "$out"
          base="https://github.com/${RELEASE_REPO}/releases/download/${VERSION}"
          if [ "$PLATFORM" = "darwin-aarch64" ]; then
            cp "$(ls "$bundle"/dmg/*.dmg | head -1)"          "$out/GCMS-Pilot_${ver}_aarch64.dmg"
            cp "$(ls "$bundle"/macos/*.app.tar.gz | head -1)" "$out/GCMS-Pilot_${ver}_aarch64.app.tar.gz"
            sig=$(cat "$(ls "$bundle"/macos/*.app.tar.gz.sig | head -1)")
            url="${base}/GCMS-Pilot_${ver}_aarch64.app.tar.gz"
          else
            # Tauri 2 的 Windows 更新产物就是 NSIS 安装器 -setup.exe 本身（附同名 .sig），没有 .nsis.zip。
            ls -la "$bundle"/nsis/ || true
            sigfile=$(ls "$bundle"/nsis/*.sig | head -1)   # 更新签名文件
            signed="${sigfile%.sig}"                        # 它签的就是那个 -setup.exe
            cp "$signed" "$out/GCMS-Pilot_${ver}_x64-setup.exe"
            sig=$(cat "$sigfile")
            url="${base}/GCMS-Pilot_${ver}_x64-setup.exe"
          fi
          node -e 'const fs=require("fs");const [dest,plat,url,sig]=process.argv.slice(1);fs.writeFileSync(dest,JSON.stringify({[plat]:{signature:sig,url}}))' "$out/frag-${PLATFORM}.json" "$PLATFORM" "$url" "$sig"
          ls -lh "$out"

      - name: 直接上传平台产物
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PILOT_RELEASES_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 两个平台可能同时到达这里。先创建草稿 Release；并发创建失败时，
          # 再确认另一作业已经创建成功即可。
          if ! gh release view "$VERSION" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$RELEASE_REPO" \
              --title "$VERSION" \
              --notes "GCMS Pilot ${VERSION#pilot-v}" \
              --draft \
              || gh release view "$VERSION" --repo "$RELEASE_REPO" >/dev/null
          fi
          gh release upload "$VERSION" "$GITHUB_WORKSPACE"/dist/* \
            --repo "$RELEASE_REPO" \
            --clobber

  publish:
    name: 合成 latest.json 并发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载平台片段 + 合并 latest.json
        env:
          GH_TOKEN: ${{ secrets.PILOT_RELEASES_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${VERSION#pilot-v}"
          root="all"; out="release"
          rm -rf "$root" "$out"; mkdir -p "$root" "$out"
          gh release download "$VERSION" \
            --repo "$RELEASE_REPO" \
            --pattern 'frag-*.json' \
            --dir "$root"
          python3 - "$out/latest.json" "$ver" all <<'PY'
          import sys, json, glob, datetime, pathlib
          dest, ver, root = sys.argv[1:4]
          platforms = {}
          for f in sorted(glob.glob(f"{root}/**/frag-*.json", recursive=True)):
              platforms.update(json.load(open(f)))
          data = {
              "version": ver,
              "notes": f"GCMS Pilot {ver}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          if set(platforms) != {"darwin-aarch64", "windows-x86_64"}:
              raise SystemExit(f"平台片段不完整: {sorted(platforms)}")
          pathlib.Path(dest).write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          echo "=== latest.json ==="; cat "$out/latest.json"; echo; ls -lh "$out"

      - name: 发布 Release（macOS + Windows 一起）
        env:
          GH_TOKEN: ${{ secrets.PILOT_RELEASES_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" release/latest.json \
            --repo "$RELEASE_REPO" \
            --clobber
          # 平台片段只用于合成 latest.json，不作为用户下载资产保留。
          gh api "repos/${RELEASE_REPO}/releases/tags/${VERSION}" \
            --jq '.assets[] | select(.name | startswith("frag-")) | .id' \
            | while read -r asset_id; do
                [ -z "$asset_id" ] || gh api --method DELETE "repos/${RELEASE_REPO}/releases/assets/${asset_id}"
              done
          gh release edit "$VERSION" \
            --repo "$RELEASE_REPO" \
            --title "$VERSION" \
            --notes "GCMS Pilot ${VERSION#pilot-v}" \
            --draft=false \
            --latest
